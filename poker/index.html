<style>

*{box-sizing:border-box}

<script>
/* ===== LOGIC START ===== */
const SUITS=['s','h','d','c'],SYM={s:'♠',h:'♥',d:'♦',c:'♣'},SNAME={s:'spades',h:'hearts',d:'diamonds',c:'clubs'};
const RT={10:'10',11:'J',12:'Q',13:'K',14:'A'},RNAME={2:'Twos',3:'Threes',4:'Fours',5:'Fives',6:'Sixes',7:'Sevens',8:'Eights',9:'Nines',10:'Tens',11:'Jacks',12:'Queens',13:'Kings',14:'Aces'};
const RONE={2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight',9:'Nine',10:'Ten',11:'Jack',12:'Queen',13:'King',14:'Ace'};
const rt=r=>RT[r]||String(r);
function newDeck(){const d=[];for(const s of SUITS)for(let r=2;r<=14;r++)d.push({s,r,id:s+r});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function topStraight(mask){/* mask bit r set for rank r; ace also counts as 1 */if(mask&(1<<14))mask|=2;for(let h=14;h>=5;h--){let ok=true;for(let k=0;k<5;k++)if(!(mask&(1<<(h-k)))){ok=false;break}if(ok)return h}return 0}
/* returns {score, cat, cards} for the best 5 of up to 7 cards; higher score wins */
function evalHand(cs){const cnt=Array(15).fill(0),bySuit={s:[],h:[],d:[],c:[]};let mask=0;
  for(const c of cs){cnt[c.r]++;bySuit[c.s].push(c);mask|=1<<c.r}
  const sc=(cat,ks)=>{let v=cat;for(let i=0;i<5;i++)v=v*15+(ks[i]||0);return v};
  let fl=null;for(const s of SUITS)if(bySuit[s].length>=5)fl=s;
  if(fl){let m=0;for(const c of bySuit[fl])m|=1<<c.r;const h=topStraight(m);if(h)return{score:sc(8,[h]),cat:8,hi:h,cards:pick(cs,c=>c.s===fl&&(h===5&&c.r===14||c.r<=h&&c.r>h-5))}}
  const groups=[];for(let r=14;r>=2;r--)if(cnt[r])groups.push([cnt[r],r]);groups.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  const kick=(ex,n)=>{const o=[];for(let r=14;r>=2&&o.length<n;r--)if(cnt[r]&&!ex.includes(r))o.push(r);return o};
  if(groups[0][0]===4){const q=groups[0][1];return{score:sc(7,[q,...kick([q],1)]),cat:7,hi:q,cards:pick(cs,c=>c.r===q)}}
  if(groups[0][0]===3&&groups.length>1&&groups[1][0]>=2){const t=groups[0][1],p=groups[1][1];return{score:sc(6,[t,p]),cat:6,hi:t,lo:p,cards:pick(cs,c=>c.r===t).concat(pick(cs,c=>c.r===p).slice(0,2))}}
  if(fl){const f=bySuit[fl].slice().sort((a,b)=>b.r-a.r).slice(0,5);return{score:sc(5,f.map(c=>c.r)),cat:5,hi:f[0].r,cards:f}}
  const st=topStraight(mask);if(st){const want=[];for(let k=0;k<5;k++)want.push(st-k===1?14:st-k);const cards=want.map(r=>cs.find(c=>c.r===r));return{score:sc(4,[st]),cat:4,hi:st,cards}}
  if(groups[0][0]===3){const t=groups[0][1];return{score:sc(3,[t,...kick([t],2)]),cat:3,hi:t,cards:pick(cs,c=>c.r===t)}}
  if(groups[0][0]===2&&groups[1]&&groups[1][0]===2){const a=groups[0][1],b=groups[1][1];return{score:sc(2,[a,b,...kick([a,b],1)]),cat:2,hi:a,lo:b,cards:pick(cs,c=>c.r===a||c.r===b)}}
  if(groups[0][0]===2){const p=groups[0][1];return{score:sc(1,[p,...kick([p],3)]),cat:1,hi:p,cards:pick(cs,c=>c.r===p)}}
  const k=kick([],5);return{score:sc(0,k),cat:0,hi:k[0],cards:pick(cs,c=>c.r===k[0])}}
function pick(cs,f){return cs.filter(f)}
function handName(e){switch(e.cat){case 8:return e.hi===14?'Royal flush':'Straight flush';case 7:return 'Four '+RNAME[e.hi];case 6:return RNAME[e.hi]+' full of '+RNAME[e.lo];
  case 5:return 'Flush';case 4:return 'Straight, '+RONE[e.hi]+' high';case 3:return 'Three '+RNAME[e.hi];case 2:return 'Two pair, '+RNAME[e.hi]+' and '+RNAME[e.lo];case 1:return 'Pair of '+RNAME[e.hi];default:return RONE[e.hi]+' high'}}
/* chance to win at showdown against n random hands */
function equity(hole,board,n,iters){const known=new Set(hole.concat(board).map(c=>c.id));const rest=newDeck().filter(c=>!known.has(c.id));let won=0;
  for(let it=0;it<iters;it++){/* partial shuffle */const need=n*2+(5-board.length);for(let i=0;i<need;i++){const j=i+Math.floor(Math.random()*(rest.length-i));[rest[i],rest[j]]=[rest[j],rest[i]]}
    const b=board.concat(rest.slice(n*2,need));const me=evalHand(hole.concat(b)).score;let best=0,ties=0,lose=false;
    for(let o=0;o<n;o++){const s=evalHand([rest[o*2],rest[o*2+1]].concat(b)).score;if(s>me){lose=true;break}if(s===me)ties++}
    if(!lose)won+=1/(ties+1)}
  return won/iters}
/* split the pot(s): players need .total (chips put in this hand), .folded, .score */
function settle(players,order){const levels=[...new Set(players.map(p=>p.total).filter(t=>t>0))].sort((a,b)=>a-b);const win=players.map(()=>0);let prev=0;const pots=[];
  for(const L of levels){let amt=0;for(const p of players)amt+=Math.max(0,Math.min(p.total,L)-prev);
    const elig=players.map((p,i)=>i).filter(i=>!players[i].folded&&players[i].total>=L);
    if(!elig.length){/* everyone at this level folded: give to best remaining */const live=players.map((p,i)=>i).filter(i=>!players[i].folded);elig.push(...live)}
    const best=Math.max(...elig.map(i=>players[i].score));const ws=order.filter(i=>elig.includes(i)&&players[i].score===best);
    const share=Math.floor(amt/ws.length);let odd=amt-share*ws.length;for(const i of ws){win[i]+=share+(odd>0?1:0);odd--}
    pots.push({amt,ws});prev=L}
  return{win,pots}}
/* ===== LOGIC END ===== */

(function(){
'use strict';
const $=id=>document.getElementById(id);
const NAMES=['You','Kourosh','Roxana','Dariush','Shirin','Arash'];
/* tightness: higher folds more. aggression: higher raises more. */
const STYLE=[null,{t:.05,a:.55,bl:.06},{t:.0,a:.35,bl:.04},{t:.08,a:.75,bl:.1},{t:-.03,a:.45,bl:.05},{t:.12,a:.6,bl:.03}];
const POS=[[50,83],[12,74],[13,25],[50,10],[87,25],[88,74]];
const BETPOS=[[50,63],[26,66],[27,36],[50,28],[73,36],[74,66]];
let P=[],dealer=-1,board=[],deckA=[],handNo=0,sb=10,bb=20,startChips=1000,speed=1,muted=false,actx,curBet=0,minRaise=20,turn=-1,showdown=false,resolveHuman=null,running=false,lastAct={};
let stats={w:0,l:0,best:0};
try{const x=JSON.parse(localStorage.getItem('afsoon-poker')||'null');if(x){stats=x.stats||stats;muted=!!x.muted;startChips=x.chips||1000}}catch(e){}
function persist(){try{localStorage.setItem('afsoon-poker',JSON.stringify({stats,muted,chips:startChips}))}catch(e){}}
function tone(f,d,type,vol){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const sfx={card:()=>tone(560+Math.random()*80,.04,'triangle',.05),chip:()=>{tone(1400,.04,'square',.025);setTimeout(()=>tone(1700,.04,'square',.02),40)},check:()=>tone(300,.06,'triangle',.06),fold:()=>tone(180,.08,'sine',.05),
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.07),i*130)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.07),i*170))};
function drawSnd(){$('wave').style.display=muted?'none':'';$('snd').setAttribute('aria-label',muted?'Sound off':'Sound on')}
const wait=ms=>new Promise(r=>setTimeout(r,ms*speed));
function status(t){$('status').textContent=t}
const fmt=n=>n.toLocaleString('en-US');
function cardHTML(c,cls){if(!c)return '<div class="slot"></div>';const red=c.s==='h'||c.s==='d',sy=SYM[c.s]+'︎';
  return `<div class="card${red?' red':''}${cls?' '+cls:''}" aria-label="${RONE[c.r]} of ${SNAME[c.s]}"><div class="ix">${rt(c.r)}<i>${sy}</i></div><div class="mid">${sy}</div></div>`}
const back='<div class="card back" aria-label="hidden card"></div>';
const pot=()=>P.reduce((a,p)=>a+p.total,0);

function render(hl){
  $('blinds').textContent=`${sb}/${bb}`;$('handNo').textContent=handNo;
  const hlIds=hl?new Set(hl):null;
  $('board').innerHTML=[0,1,2,3,4].map(i=>cardHTML(board[i],board[i]&&hlIds?(hlIds.has(board[i].id)?'hi':'dim'):'')).join('');
  $('pot').textContent='Pot '+fmt(pot());
  let h='';P.forEach((p,i)=>{const[x,y]=POS[i];const cls=['seat',i===0?'me':'',turn===i?'turn':'',p.folded?'fold':'',p.out?'out':'',p.winner?'winner':''].join(' ');
    let cards='';if(p.hand.length&&!p.out){const show=i===0||(showdown&&!p.folded);cards=show?p.hand.map(c=>cardHTML(c,hlIds&&p.winner?(hlIds.has(c.id)?'hi':''):'')).join(''):back+back}
    h+=`<div class="${cls}" style="left:${x}%;top:${y}%"><div class="cards">${cards}</div><div class="plate"><div class="nm">${NAMES[i]}</div><div class="ch">${p.out?'Out':fmt(p.chips)}</div></div><div class="act">${p.label||''}</div>${p.hn?`<div class="hn">${p.hn}</div>`:''}</div>`;
    if(p.bet>0){const[bx,by]=BETPOS[i];h+=`<div class="bet" style="left:${bx}%;top:${by}%">${fmt(p.bet)}</div>`}
    if(i===dealer){const[bx,by]=BETPOS[i];h+=`<div class="dealer" style="left:${bx+(i===0||i===3?9:0)}%;top:${by+(i===0||i===3?0:-8)}%" title="Dealer">D</div>`}});
  $('seats').innerHTML=h}

function newGame(){P=NAMES.map(()=>({chips:startChips,hand:[],bet:0,total:0,folded:false,allin:false,out:false,acted:false,label:'',hn:'',winner:false}));
  dealer=Math.floor(Math.random()*6);handNo=0;sb=10;bb=20;board=[];running=true;render();loop()}
const nextLive=(i,f)=>{for(let k=1;k<=6;k++){const j=(i+k)%6;if(f(P[j]))return j}return -1};
async function loop(){while(running){
  const alive=P.filter(p=>!p.out);if(P[0].out||alive.length===1)return gameOver();
  await playHand();if(!running)return;await wait(400)}}
async function playHand(){handNo++;if(handNo>1&&(handNo-1)%10===0){sb*=2;bb*=2;status(`Blinds go up to ${sb}/${bb}.`);await wait(900)}
  showdown=false;board=[];deckA=shuffle(newDeck());
  for(const p of P){p.hand=[];p.bet=0;p.total=0;p.folded=p.out;p.allin=false;p.acted=false;p.label='';p.hn='';p.winner=false}
  dealer=nextLive(dealer,p=>!p.out);
  const live=P.filter(p=>!p.out).length;
  const sbS=live===2?dealer:nextLive(dealer,p=>!p.out),bbS=nextLive(sbS,p=>!p.out);
  post(sbS,sb,'Small blind');post(bbS,bb,'Big blind');curBet=bb;minRaise=bb;
  for(let r=0;r<2;r++)for(let k=1;k<=6;k++){const j=(dealer+k)%6;if(!P[j].out)P[j].hand.push(deckA.pop())}
  sfx.card();render();status(`Hand ${handNo}. ${NAMES[dealer]} ${dealer===0?'are':'is'} the dealer.`);await wait(700);
  const streets=['Pre-flop','Flop','Turn','River'];
  for(let st=0;st<4;st++){
    if(st>0){for(const p of P){p.bet=0;p.acted=false;if(!p.folded&&!p.allin)p.label=''}curBet=0;minRaise=bb;
      const n=st===1?3:1;for(let k=0;k<n;k++)board.push(deckA.pop());sfx.card();render();status(streets[st]);await wait(650)}
    const first=st===0?nextLive(bbS,p=>!p.out):nextLive(dealer,p=>!p.out);
    await betting(first);
    if(P.filter(p=>!p.folded).length===1)return award()}
  return award()}
function post(i,amt,lbl){const p=P[i];const a=Math.min(amt,p.chips);p.chips-=a;p.bet+=a;p.total+=a;if(!p.chips)p.allin=true;p.label=lbl}
function canAct(p){return !p.folded&&!p.allin&&!p.out}
function roundDone(){const live=P.filter(p=>!p.folded);if(live.length<=1)return true;const act=P.filter(canAct);
  if(act.every(p=>p.acted&&p.bet===curBet))return true;
  if(act.length===1&&act[0].bet>=curBet&&P.filter(p=>!p.folded&&p.allin).length+1===live.length)return true;
  if(act.length===0)return true;return false}
async function betting(start){let i=start;let guard=0;
  while(!roundDone()&&guard++<200){const p=P[i];
    if(canAct(p)&&!(p.acted&&p.bet===curBet)){turn=i;render();
      const a=i===0?await humanAct():await aiAct(i);
      apply(i,a);turn=-1;render();await wait(i===0?150:380)}
    i=(i+1)%6}
  /* gather bets into pot */
  for(const p of P)p.bet=0;render()}
function apply(i,a){const p=P[i],toCall=curBet-p.bet;
  if(a.t==='fold'){p.folded=true;p.label='Fold';sfx.fold()}
  else if(a.t==='call'){const amt=Math.min(toCall,p.chips);p.chips-=amt;p.bet+=amt;p.total+=amt;if(!p.chips)p.allin=true;p.label=toCall===0?'Check':p.allin?'All-in':'Call';toCall?sfx.chip():sfx.check()}
  else{/* raise to a.to (total bet this street) */let to=Math.min(a.to,p.bet+p.chips);const amt=to-p.bet;p.chips-=amt;p.bet=to;p.total+=amt;if(!p.chips)p.allin=true;
    const inc=to-curBet;if(inc>=minRaise)minRaise=inc;if(to>curBet){curBet=to;for(const q of P)if(q!==p&&canAct(q))q.acted=false}
    p.label=p.allin?'All-in':(curBet===inc?'Bet':'Raise');sfx.chip()}
  p.acted=true}
/* ---------- computer players ---------- */
async function aiAct(i){status(`${NAMES[i]} is thinking...`);await wait(450+Math.random()*350);
  const p=P[i],s=STYLE[i],toCall=curBet-p.bet,opp=P.filter((q,j)=>j!==i&&!q.folded).length;
  const eq=equity(p.hand,board,Math.max(1,opp),board.length?260:200);
  const potNow=pot(),odds=toCall/(potNow+toCall||1);
  /* how strong is this hand compared with an average one in this field */
  const strength=eq*(opp+1);const r=Math.random();
  const raiseTo=f=>{const amt=Math.max(curBet+minRaise,Math.round((curBet+f*(potNow+toCall))/bb)*bb);return{t:'raise',to:amt}};
  if(strength>1.9-s.a*.4&&r<.55+s.a*.4)return raiseTo(strength>2.6?1:.6);
  if(toCall===0){if(r<s.bl*(board.length?1.6:1))return raiseTo(.5);if(strength>1.3&&r<s.a*.5)return raiseTo(.5);return{t:'call'}}
  if(r<s.bl*.5&&toCall<p.chips*.25)return raiseTo(.7);
  const need=odds+s.t+(toCall>p.chips*.5?.12:0);
  if(eq>=need||(toCall<=bb&&eq>.18&&!board.length))return{t:'call'};
  return{t:'fold'}}
/* ---------- you ---------- */
function humanAct(){return new Promise(res=>{resolveHuman=res;const p=P[0],toCall=curBet-p.bet,maxTo=p.bet+p.chips;
  const minTo=Math.min(maxTo,curBet+minRaise);$('controls').hidden=false;
  status(toCall?`Your turn: ${fmt(toCall)} to call.`:'Your turn: check or bet.');
  $('callB').textContent=toCall?(toCall>=p.chips?`All-in ${fmt(p.chips)}`:`Call ${fmt(toCall)}`):'Check';
  $('foldB').disabled=!toCall;
  const canRaise=maxTo>curBet&&P.some((q,j)=>j&&canAct(q));
  const sl=$('slider');sl.min=minTo;sl.max=maxTo;sl.step=Math.max(1,Math.floor(bb/2));sl.value=minTo;sl.disabled=!canRaise||minTo>=maxTo;
  $('raiseB').disabled=!canRaise;$('slider').parentElement.hidden=!canRaise||minTo>=maxTo;
  const pv=pot();const pre=[['Min',minTo],['½ Pot',curBet+Math.round((pv+toCall)/2)],['Pot',curBet+pv+toCall],['All-in',maxTo]];
  $('presets').innerHTML=canRaise?pre.map(([l,v])=>`<button class="btn sm" data-v="${Math.max(minTo,Math.min(maxTo,v))}">${l}</button>`).join(''):'';
  updRaise()})}
function updRaise(){const v=+$('slider').value,p=P[0];$('raiseB').textContent=(v>=p.bet+p.chips?'All-in ':(curBet?'Raise to ':'Bet '))+fmt(v)}
$('slider').oninput=updRaise;
$('presets').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;$('slider').value=b.dataset.v;updRaise()};
function done(a){if(!resolveHuman)return;$('controls').hidden=true;const r=resolveHuman;resolveHuman=null;r(a)}
$('foldB').onclick=()=>{if(curBet-P[0].bet===0)return;done({t:'fold'})};
$('callB').onclick=()=>done({t:'call'});
$('raiseB').onclick=()=>done({t:'raise',to:+$('slider').value});
addEventListener('keydown',e=>{if(!resolveHuman||e.target.tagName==='INPUT')return;if(e.key==='c'||e.key==='C')$('callB').click();if(e.key==='f'||e.key==='F')$('foldB').click()});

async function award(){turn=-1;const live=P.map((p,i)=>i).filter(i=>!P[i].folded);
  /* deal the rest of the board if players are all-in */
  if(live.length>1){while(board.length<5){board.push(deckA.pop());sfx.card();showdown=true;render();await wait(600)}}
  showdown=live.length>1;
  for(const p of P){p.score=-1}
  if(live.length===1)P[live[0]].score=1;else for(const i of live){const e=evalHand(P[i].hand.concat(board));P[i].score=e.score;P[i].ev=e;P[i].hn=handName(e)}
  const order=[];for(let k=1;k<=6;k++)order.push((dealer+k)%6);
  const{win}=settle(P,order);let msg=[],hl=[];
  win.forEach((w,i)=>{if(w>0){P[i].chips+=w;P[i].winner=true;msg.push(`${NAMES[i]} ${i===0?'win':'wins'} ${fmt(w)}${showdown?' with '+P[i].hn.toLowerCase():''}`);if(showdown&&P[i].ev)hl.push(...P[i].ev.cards.map(c=>c.id))}});
  if(win[0]>stats.best){stats.best=win[0];persist()}
  win[0]>0?sfx.win():0;
  for(const p of P){p.total=0;if(!p.winner&&!p.folded)p.label=''}
  render(showdown?hl:null);status(msg.join('. ')+'.');
  for(const p of P)if(p.chips<=0&&!p.out){p.out=true}
  await wait(showdown?3000:1700);for(const p of P){p.winner=false;p.hn=''}
  if(P.some((p,i)=>i&&p.out&&p.label!=='Out')){P.forEach((p,i)=>{if(p.out)p.label=''})}}
function gameOver(){running=false;const won=!P[0].out;if(won)stats.w++;else stats.l++;persist();won?sfx.win():sfx.lose();render();
  dialog(`<h2>${won?'You won the table!':'You are out of chips'}</h2><p>${won?`You took every chip in ${handNo} hands. The palace salutes you.`:`You lasted ${handNo} hands.`}</p><p style="font-size:.9rem;color:var(--muted)">Tables won: ${stats.w}, lost: ${stats.l}. Biggest pot: ${fmt(stats.best)}.</p>
    <div class="btns"><button class="btn primary" data-a="again">Play again</button></div>`)}
function dialog(h){$('dlg').innerHTML=h;$('ov').hidden=false;const p=$('dlg').querySelector('.btn.primary');if(p)p.focus()}
function menu(){dialog(`<h2>Afsoon Poker</h2><p>Texas Hold'em against five computer players. Everyone starts with the same chips. Take them all to win the table. Chips only, no real money.</p>
  <ul><li>You get two cards. Five shared cards come in three steps: the flop (3), the turn (1) and the river (1).</li><li>Make the best five-card hand from your two cards and the five on the table.</li><li>Blinds go up every 10 hands.</li></ul>
  <h3>Hand ranking, best first</h3><ol><li>Royal flush, straight flush</li><li>Four of a kind</li><li>Full house</li><li>Flush</li><li>Straight</li><li>Three of a kind</li><li>Two pair</li><li>One pair</li><li>High card</li></ol>
  <h3>Speed</h3><div class="btns">${[['Relaxed',1.4],['Normal',1],['Fast',.55]].map(([l,v])=>`<button class="btn sm${v===speed?' on':''}" data-sp="${v}">${l}</button>`).join('')}</div>
  <div class="btns">${running?'<button class="btn" data-a="close">Continue</button>':''}<button class="btn primary" data-a="again">${running?'Restart table':'Start the table'}</button></div>`);
  $('dlg').querySelectorAll('[data-sp]').forEach(b=>b.onclick=e=>{e.stopPropagation();speed=+b.dataset.sp;menu()})}
$('dlg').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;$('ov').hidden=true;
  if(a.dataset.a==='again'){if(running){running=false;if(resolveHuman){$('controls').hidden=true;resolveHuman=null}location.reload();return}newGame()}});
$('menuBtn').onclick=menu;$('snd').onclick=()=>{muted=!muted;persist();drawSnd()};
P=NAMES.map(()=>({chips:startChips,hand:[],bet:0,total:0,folded:false,allin:false,out:false,label:'',hn:''}));drawSnd();render();menu();
})();
</script>
