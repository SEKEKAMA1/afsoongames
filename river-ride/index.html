<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#071a22">
<link rel="icon" type="image/png" href="/img/favicon-64.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>River Ride</title>
<meta name="description" content="River Ride by Afsoon Games. A classic river shooter: fly up the Karun river, shoot boats, helicopters and bridges, and fly over fuel depots before your tank runs dry. Free in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071a22;--line:rgba(212,165,44,.35);--gold:#d4a52c;--gold-2:#f6d999;--text:#f1f6f5;--muted:#9fbcc0;--display:Cinzel,Georgia,serif;--ui:Nunito,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(90% 80% at 50% 40%,#123a4a 0%,var(--bg) 70%);color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:max(6px,env(safe-area-inset-top,0px)) 8px max(6px,env(safe-area-inset-bottom,0px))}
.top{width:min(100%,560px);display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.08em;color:var(--gold-2);margin-right:auto;line-height:1.05}
.brand small{display:block;font:800 .56rem var(--ui);letter-spacing:.24em;color:var(--gold);margin-top:3px}
.ib{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;color:var(--text)}
.ib svg{width:18px;height:18px}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:12px;border:2px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.5);background:#1b8a86}
.pad{display:none;width:min(100%,560px);justify-content:space-between;gap:8px}
.pad .grp{display:flex;gap:8px}
.pad button{width:64px;height:58px;border-radius:16px;border:1px solid var(--line);background:rgba(10,40,50,.85);font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none}
.pad button.fire{width:92px;background:#8e2a2a;border-color:#c0504a;font-size:1rem}
.pad button.on{background:var(--gold);color:#2a1c06}
.pad button.fire.on{background:#ff6b5a}
@media (pointer:coarse){.pad{display:flex}}
.hint{font-size:.75rem;color:var(--muted);text-align:center}
@media (pointer:coarse){.hint{display:none}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,12,16,.72);display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.dlg{width:min(420px,100%);background:linear-gradient(180deg,#14404d,#0b2630);border:1px solid rgba(212,165,44,.5);border-radius:20px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:in .3s cubic-bezier(.2,.8,.3,1.2)}
@keyframes in{from{transform:scale(.85);opacity:0}}
.dlg h2{font-family:var(--display);margin:0;color:var(--gold-2);font-size:1.6rem}
.dlg p{margin:0;color:#d9e8e8;line-height:1.55}
.dlg ul{text-align:left;margin:0;padding-left:20px;color:#cfe0e0;line-height:1.5;font-size:.9rem}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--line);background:rgba(10,40,50,.8);font-weight:800}
.btn.primary{background:var(--gold);color:#2a1c06;border-color:var(--gold)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">River Ride<small>CLASSIC RIVER SHOOTER</small></div>
    <button class="ib" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="ib" id="snd" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <a class="ib" href="/" aria-label="More Afsoon games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></a>
  </header>
  <div class="stage" id="stage"><canvas id="cv" width="480" height="720" aria-label="River Ride game"></canvas></div>
  <div class="pad" id="pad">
    <div class="grp"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
    <div class="grp"><button data-k="up" aria-label="Faster">▲</button><button data-k="down" aria-label="Slower">▼</button><button class="fire" data-k="fire">FIRE</button></div>
  </div>
  <div class="hint">Arrows or A/D to steer · Up/Down for speed · Space to fire · P to pause</div>
</div>
<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=480,H=720,PY=600,SEG=220,PER=8; /* plane screen y, segment length, segments per section (last one has the bridge) */
const BANK='#3f8f3a',BANK2='#2f7a2c',WATER='#1b6fa8',ROAD='#5b5146';
let keys={},muted=false,actx,state='menu',paused=false;
let best=0;try{best=+localStorage.getItem('afsoon-river-best')||0;muted=localStorage.getItem('afsoon-river-muted')==='1'}catch(e){}

/* ---------- map: seeded so the river is the same every game, like the original ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const segCache=new Map();
function seg(k){if(segCache.has(k))return segCache.get(k);const r=rng(k*7919+13);const sec=Math.floor(k/PER),w=k%PER;let s;
  if(k<2)s={l:120,r:360,isl:0};
  else if(w===PER-1)s={l:190,r:290,isl:0,bridge:true};
  else if(w===0)s={l:140,r:340,isl:0};
  else{const prev=seg(k-1),diff=Math.min(1,sec/8);
    for(let tries=0;tries<30&&!s;tries++){const width=Math.round(330-diff*120-r()*120);const cx=240+Math.round((r()-.5)*(440-width)*.6);
      let l=Math.max(24,cx-width/2),rr=Math.min(456,cx+width/2);let isl=0;
      if(rr-l>260&&r()<.35+diff*.2)isl=Math.round(60+r()*Math.min(120,rr-l-200));
      const c={l:Math.round(l),r:Math.round(rr),isl};if(passable(prev,c)&&(w!==PER-2||passable(c,{l:190,r:290,isl:0})))s=c}
    if(!s)s=w===PER-2?{l:150,r:330,isl:0}:{l:prev.l,r:prev.r,isl:0}}
  s.k=k;s.sec=sec;segCache.set(k,s);return s}
/* you must be able to fly from every channel of the previous segment into the next one */
function passable(p,c){const nc=spans(c);return spans(p).every(([a,b])=>nc.some(([x,y])=>Math.min(b,y)-Math.max(a,x)>=64))}
/* water spans for a segment */
function spans(s){if(!s.isl)return[[s.l,s.r]];const c=(s.l+s.r)/2;return[[s.l,c-s.isl/2],[c+s.isl/2,s.r]]}
function segAt(wy){return seg(Math.floor(wy/SEG))}
function inWater(x0,x1,wy){const s=segAt(wy);return spans(s).some(([a,b])=>x0>=a&&x1<=b)}

/* ---------- game state ---------- */
let G;
function newGame(){G={score:0,lives:4,nextLife:10000,cp:0};respawn();state='play';hideDlg()}
function respawn(){const start=G.cp*PER*SEG;Object.assign(G,{dist:start+40,x:240,fuel:100,ents:[],gen:new Set(),bullets:[],booms:[],dead:0,cool:0,speed:2.4,lowBeep:0,bridgesDown:new Set(G.bridgesDown||[])});
  for(const b of [...G.bridgesDown])if(b>=G.cp)G.bridgesDown.delete(b)}
function genSeg(k){if(G.gen.has(k))return;G.gen.add(k);const s=seg(k),w=k%PER;const r=rng(k*104729+7);const y0=k*SEG;
  if(s.bridge){G.ents.push({t:'bridge',x:0,w:W,y:y0+SEG/2,h:26,sec:s.sec});return}
  if(k<2)return;const n=1+Math.floor(r()*(2+Math.min(2,s.sec/3)));
  for(let i=0;i<n;i++){const sp=spans(s)[Math.floor(r()*spans(s).length)];const y=y0+(w===0?120:30)+r()*(SEG-(w===0?150:60));const roll=r();
    if(roll<.28){const w=26,h=46;if(sp[1]-sp[0]>w+10)G.ents.push({t:'fuel',x:sp[0]+5+r()*(sp[1]-sp[0]-w-10),y,w,h})}
    else if(roll<.62)G.ents.push({t:'ship',x:sp[0]+10+r()*Math.max(0,sp[1]-sp[0]-80),y,w:60,h:18,vx:(r()<.5?-1:1)*(.8+r()*.8+s.sec*.08),act:false,lo:sp[0],hi:sp[1]});
    else if(roll<.9)G.ents.push({t:'heli',x:sp[0]+10+r()*Math.max(0,sp[1]-sp[0]-60),y,w:40,h:24,vx:(r()<.5?-1:1)*(1+r()+s.sec*.1),act:false,lo:sp[0],hi:sp[1]});
    else G.ents.push({t:'jet',x:r()<.5?-50:W+10,y,w:44,h:16,vx:0,act:false,dir:r()<.5?1:-1})}}
const sy=wy=>PY-(wy-G.dist); /* world y to screen y */

/* ---------- sound ---------- */
function tone(f,d,type,vol,slide){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,actx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,actx.currentTime+d);g.gain.setValueAtTime(vol||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function noise(d,vol){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const n=actx.sampleRate*d,b=actx.createBuffer(1,n,actx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=vol||.12;s.connect(g).connect(actx.destination);s.start()}catch(e){}}
const sfx={shot:()=>tone(900,.12,'square',.03,300),boom:()=>{noise(.4,.15);tone(120,.4,'sawtooth',.05,40)},fuel:()=>tone(1200,.05,'sine',.03),low:()=>tone(440,.15,'square',.04),crash:()=>{noise(.9,.22);tone(200,.8,'sawtooth',.07,30)},life:()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.06),i*90))};

/* ---------- update ---------- */
function boom(x,y,big){G.booms.push({x,y,t:0,big});sfx.boom()}
function addScore(n){G.score+=n;if(G.score>=G.nextLife){G.lives++;G.nextLife+=10000;sfx.life()}}
function update(){if(G.dead){G.dead--;for(const b of G.booms)b.t++;G.booms=G.booms.filter(b=>b.t<40);if(!G.dead){if(G.lives<=0)return gameOver();respawn()}return}
  const L=keys.left,R=keys.right;G.speed=keys.up?4.2:keys.down?1.3:2.4;G.dist+=G.speed;
  G.x+=(R?1:0)*4.2-(L?1:0)*4.2;G.x=Math.max(14,Math.min(W-14,G.x));
  G.fuel-=.045*(G.speed/2.4*.5+.5);
  for(let k=Math.floor((G.dist-120)/SEG);k<=Math.floor((G.dist+H)/SEG);k++)if(k>=0)genSeg(k);
  /* shooting */
  if(G.cool>0)G.cool--;if(keys.fire&&G.cool<=0&&G.bullets.length<2){G.bullets.push({x:G.x,y:G.dist+20});G.cool=14;sfx.shot()}
  for(const b of G.bullets){b.y+=11+G.speed;b.x=b.x}
  /* enemies */
  let onFuel=false;
  for(const e of G.ents){const s=sy(e.y);if(!e.act&&s>-40&&s<H*.9&&Math.abs(e.y-G.dist)<520)e.act=true;
    if(e.act&&(e.t==='ship'||e.t==='heli')){e.x+=e.vx;if(e.x<e.lo+2||e.x+e.w>e.hi-2){e.vx*=-1;e.x+=e.vx*2}}
    if(e.act&&e.t==='jet'){e.x+=e.dir*5;if(e.x>W+60)e.x=-60;if(e.x<-60)e.x=W+60}}
  /* bullet hits */
  for(const b of G.bullets){for(const e of G.ents){if(e.gone)continue;
      if(b.x>e.x-3&&b.x<e.x+e.w+3&&b.y>e.y-e.h/2&&b.y<e.y+e.h/2+12){
        if(e.t==='bridge'){if(!(b.x>segAt(e.y).l&&b.x<segAt(e.y).r))continue;e.gone=true;G.bridgesDown.add(e.sec);G.cp=e.sec+1;addScore(500);boom(b.x,e.y,true)}
        else{e.gone=true;addScore({fuel:80,ship:30,heli:60,jet:100}[e.t]);boom(e.x+e.w/2,e.y)}
        b.y=1e9;break}}
    /* bullets stop at banks */
    if(b.y<1e8&&!inWater(b.x-1,b.x+1,b.y)&&!G.ents.some(e=>e.t==='bridge'&&!e.gone&&Math.abs(e.y-b.y)<20))b.y=1e9}
  G.bullets=G.bullets.filter(b=>b.y<G.dist+PY+20);
  G.ents=G.ents.filter(e=>!e.gone&&e.y>G.dist-140);
  /* plane collisions: plane is about 28 wide, 30 tall, nose at dist+16 */
  const px0=G.x-12,px1=G.x+12;
  if(!inWater(px0,px1,G.dist+14)||!inWater(G.x-5,G.x+5,G.dist+28)||!inWater(px0,px1,G.dist))return crash();
  for(const e of G.ents){const ey=e.y,hit=px1>e.x&&px0<e.x+e.w&&G.dist+28>ey-e.h/2&&G.dist<ey+e.h/2;
    if(!hit)continue;if(e.t==='fuel'){onFuel=true;continue}
    if(e.t==='bridge'&&G.bridgesDown.has(e.sec))continue;return crash()}
  if(onFuel&&G.fuel<100){G.fuel=Math.min(100,G.fuel+.55);if(Math.random()<.3)sfx.fuel()}
  if(G.fuel<=0)return crash('Out of fuel!');
  if(G.fuel<25){G.lowBeep--;if(G.lowBeep<=0){sfx.low();G.lowBeep=40}}
  for(const b of G.booms)b.t++;G.booms=G.booms.filter(b=>b.t<30)}
function crash(msg){G.lives--;G.dead=90;G.msg=msg||'';G.booms.push({x:G.x,y:G.dist+14,t:0,big:true});sfx.crash()}

/* ---------- draw ---------- */
function drawPlane(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#f6d999';ctx.strokeStyle='#5a3a14';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(4,-6);ctx.lineTo(15,4);ctx.lineTo(15,8);ctx.lineTo(4,4);ctx.lineTo(3,11);ctx.lineTo(8,15);ctx.lineTo(-8,15);ctx.lineTo(-3,11);ctx.lineTo(-4,4);ctx.lineTo(-15,8);ctx.lineTo(-15,4);ctx.lineTo(-4,-6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#2aa6a0';ctx.fillRect(-2,-8,4,6);ctx.restore()}
function drawEnt(e){const y=sy(e.y);if(y<-60||y>H+60)return;
  if(e.t==='bridge'){const s=segAt(e.y);ctx.fillStyle=ROAD;ctx.fillRect(0,y-10,W,20);ctx.fillStyle='#e6d3a3';for(let x=8;x<W;x+=28)ctx.fillRect(x,y-1,14,2);
    if(!G.bridgesDown.has(e.sec)){ctx.fillStyle='#c79a52';ctx.fillRect(s.l,y-13,s.r-s.l,26);ctx.fillStyle='#8a6230';for(let x=s.l+6;x<s.r-10;x+=22){ctx.beginPath();ctx.arc(x+8,y+13,8,Math.PI,0);ctx.fill()}
      ctx.strokeStyle='#5a3a14';ctx.lineWidth=2;ctx.strokeRect(s.l,y-13,s.r-s.l,26)}return}
  if(e.t==='fuel'){ctx.fillStyle='#d24b3c';ctx.fillRect(e.x,y-e.h/2,e.w,e.h);ctx.fillStyle='#fff';ctx.font='800 10px Nunito,sans-serif';ctx.textAlign='center';
    'FUEL'.split('').forEach((c,i)=>ctx.fillText(c,e.x+e.w/2,y-e.h/2+11+i*10.5));return}
  if(e.t==='ship'){ctx.fillStyle='#2b2b2b';ctx.beginPath();const d=e.vx>0?1:-1,x0=e.x,x1=e.x+e.w;ctx.moveTo(x0,y-5);ctx.lineTo(x1,y-5);ctx.lineTo(d>0?x1-8:x1,y+8);ctx.lineTo(d>0?x0:x0+8,y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8e8e8';ctx.fillRect(e.x+e.w*.3,y-12,e.w*.35,7);ctx.fillStyle='#d4a52c';ctx.fillRect(e.x+e.w*.55,y-17,5,6);return}
  if(e.t==='heli'){ctx.fillStyle='#1f5a2a';ctx.beginPath();ctx.ellipse(e.x+e.w*.38,y,13,8,0,0,7);ctx.fill();ctx.fillRect(e.x+e.w*.38,y-2,e.w*.6,4);ctx.fillRect(e.x+e.w-4,y-6,4,12);
    ctx.fillStyle='#9fd8ff';ctx.beginPath();ctx.ellipse(e.x+e.w*.3,y-1,5,4,0,0,7);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=2;const a=(performance.now()/40)%6;ctx.beginPath();ctx.moveTo(e.x+e.w*.38-18+a,y-10);ctx.lineTo(e.x+e.w*.38+18-a,y-10);ctx.stroke();return}
  if(e.t==='jet'){ctx.fillStyle='#4a5e8a';ctx.save();ctx.translate(e.x+e.w/2,y);ctx.scale(e.dir,1);ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-16,-7);ctx.lineTo(-22,-12);ctx.lineTo(-20,0);ctx.lineTo(-22,12);ctx.lineTo(-16,7);ctx.closePath();ctx.fill();ctx.restore()}}
function draw(){ctx.fillStyle=BANK;ctx.fillRect(0,0,W,H);
  const k0=Math.floor((G.dist-PY-SEG)/SEG),k1=Math.floor((G.dist+H)/SEG)+1;
  for(let k=Math.max(0,k0);k<=k1;k++){const s=seg(k),yTop=sy((k+1)*SEG),yBot=sy(k*SEG);
    ctx.fillStyle=WATER;for(const[a,b]of spans(s))ctx.fillRect(a,yTop-1,b-a,yBot-yTop+2);
    /* banks texture: palms */
    const r=rng(k*31+5);ctx.fillStyle=BANK2;for(let i=0;i<5;i++){const left=r()<.5;const x=left?r()*Math.max(0,s.l-20):s.r+10+r()*Math.max(0,W-s.r-20);const y=yTop+r()*SEG;ctx.beginPath();ctx.arc(x+5,y,7,0,7);ctx.fill()}
    if(s.isl){const c=(s.l+s.r)/2;ctx.fillStyle='#d9c48c';ctx.fillRect(c-s.isl/2+4,yTop+4,s.isl-8,yBot-yTop-8)}}
  for(const e of G.ents)drawEnt(e);
  ctx.fillStyle='#ffe08a';for(const b of G.bullets)ctx.fillRect(b.x-1.5,sy(b.y)-10,3,12);
  if(!G.dead)drawPlane(G.x,PY-14);
  for(const b of G.booms){const y=sy(b.y),r=(b.big?36:22)*Math.min(1,b.t/10+.3);ctx.globalAlpha=Math.max(0,1-b.t/30);ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(b.x,y,r,0,7);ctx.fill();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(b.x,y,r*.5,0,7);ctx.fill();ctx.globalAlpha=1}
  /* HUD */
  ctx.fillStyle='rgba(5,25,30,.82)';ctx.fillRect(0,H-56,W,56);ctx.fillStyle='#d4a52c';ctx.fillRect(0,H-56,W,2);
  ctx.font='800 20px Nunito,sans-serif';ctx.textAlign='left';ctx.fillStyle='#f6d999';ctx.fillText(G.score.toLocaleString('en-US'),14,H-22);
  ctx.textAlign='right';ctx.fillText('✈'.repeat(Math.max(0,Math.min(6,G.lives))),W-14,H-22);
  /* fuel gauge */
  const gx=W/2-90,gy=H-44,gw=180;ctx.fillStyle='#0b2630';ctx.fillRect(gx,gy,gw,24);ctx.strokeStyle='#d4a52c';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,24);
  ctx.fillStyle=G.fuel<25?'#ff5a4a':'#2aa6a0';ctx.fillRect(gx+3,gy+3,(gw-6)*Math.max(0,G.fuel)/100,18);
  ctx.fillStyle='#fff';ctx.font='800 12px Nunito,sans-serif';ctx.textAlign='left';ctx.fillText('E',gx+6,gy+17);ctx.textAlign='right';ctx.fillText('F',gx+gw-6,gy+17);ctx.textAlign='center';ctx.fillText('FUEL',gx+gw/2,gy+17);
  ctx.textAlign='center';ctx.font='800 14px Nunito,sans-serif';ctx.fillStyle='#f6d999';ctx.fillText('Bridge '+(G.cp+1),W/2,18);
  if(G.dead&&G.msg){ctx.font='700 30px Cinzel,serif';ctx.fillText(G.msg,W/2,H/2)}
  if(paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f6d999';ctx.font='700 34px Cinzel,serif';ctx.fillText('Paused',W/2,H/2)}}

/* ---------- loop ---------- */
let acc=0,last=0;
function frame(t){requestAnimationFrame(frame);if(!last)last=t;acc+=Math.min(100,t-last);last=t;
  if(state==='play'&&!paused){while(acc>=1000/60){update();acc-=1000/60;if(state!=='play')break}}else acc=0;
  if(G)draw()}
function gameOver(){state='over';if(G.score>best){best=G.score;try{localStorage.setItem('afsoon-river-best',best)}catch(e){}}
  dlg(`<h2>Game over</h2><p>Score <b>${G.score.toLocaleString('en-US')}</b>. You reached bridge ${G.cp+1}.</p><p style="color:var(--muted);font-size:.9rem">Best: ${best.toLocaleString('en-US')}</p><div class="btns"><a class="btn" href="/" style="display:inline-flex;align-items:center;text-decoration:none">More games</a><button class="btn primary" id="go">Fly again</button></div>`)}
function dlg(h){$('dlg').innerHTML=h;$('ov').hidden=false;const b=$('go');if(b){b.onclick=()=>{if(!actx&&!muted){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}newGame()};b.focus()}}
function hideDlg(){$('ov').hidden=true}
function menu(){dlg(`<h2>River Ride</h2><p>Fly your golden plane up the river. Shoot boats, helicopters and jets, and blow up the bridges to move on.</p>
  <ul><li>Fly <b>over</b> red FUEL depots to fill your tank. Shooting them scores points, but then they are gone.</li><li>Don't touch the river banks, the islands or anything you have not shot.</li><li>Each bridge you destroy is a checkpoint. Extra plane every 10,000 points.</li></ul>
  <p style="color:var(--muted);font-size:.9rem">Best score: ${best.toLocaleString('en-US')}</p><div class="btns"><button class="btn primary" id="go">Start flying</button></div>`)}
/* ---------- input ---------- */
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',' ':'fire'};
addEventListener('keydown',e=>{if(KM[e.key]){keys[KM[e.key]]=true;e.preventDefault()}if((e.key==='p'||e.key==='P'||e.key==='Escape')&&state==='play')togglePause();if(e.key==='Enter'&&!$('ov').hidden&&$('go'))$('go').click()});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=false});
$('pad').querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');if(!actx&&!muted){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}};const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
function togglePause(){paused=!paused}
$('pauseBtn').onclick=()=>{if(state==='play')togglePause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('afsoon-river-muted',muted?'1':'0')}catch(e){};$('wave').style.display=muted?'none':''};$('wave').style.display=muted?'none':'';
/* ---------- fit canvas ---------- */
function fit(){const st=$('stage').getBoundingClientRect();const s=Math.min(st.width/W,st.height/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
G={score:0,lives:4,cp:0,nextLife:10000};respawn();menu();requestAnimationFrame(frame);
window.__rr={get G(){return G},keys,newGame,seg,spans,SEG};
})();
</script>
