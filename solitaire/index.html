<title>Afsoon Solitaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one card table, gold-framed lapis felt; stock/waste left, four foundations right, seven tableau columns below */
:root{
  --felt:#0d2b4a; --felt-deep:#081d33; --gold:#d9a441; --gold-soft:#f2d08a;
  --ink:#eaf1f8; --muted:#9db6cf; --slot:rgba(217,164,65,.35);
  --display:"Marcellus",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--felt-deep);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,30px);color:var(--gold-soft);margin:0;letter-spacing:.04em}
.stats{display:flex;gap:16px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.btns{display:flex;gap:8px}
button{font:600 13px var(--body);color:var(--gold-soft);background:transparent;border:1px solid var(--gold);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{background:rgba(217,164,65,.12)}
button:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
.table{background:var(--felt);border:2px solid var(--gold);border-radius:14px;padding:clamp(8px,2vw,16px);user-select:none;-webkit-user-select:none}
.row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(4px,1.2vw,10px)}
.top{margin-bottom:clamp(10px,2vw,16px)}
.slot{position:relative;aspect-ratio:240/336;max-width:100%;border:1.5px dashed var(--slot);border-radius:7%;display:flex;align-items:center;justify-content:center;color:var(--slot);font-size:clamp(16px,3vw,26px);cursor:pointer}
.col{position:relative;cursor:pointer}
.card{position:absolute;left:0;width:100%;aspect-ratio:240/336;cursor:pointer;transition:top .12s}
.card img{width:100%;height:100%;display:block;pointer-events:none}
.slot .card{top:0}
.card.sel img{filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 4px var(--gold-soft))}
.card.sel{outline:2px solid var(--gold-soft);outline-offset:1px;border-radius:7%}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.ghost .card{position:absolute}
.table .card,.table .slot{touch-action:none}
.help{font-size:13px;color:var(--muted);text-align:center;margin:0}
.win{text-align:center;font-family:var(--display);font-size:22px;color:var(--gold-soft);min-height:1.3em}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <a href="/games/" style="color:var(--muted);font-size:13px;text-decoration:none">&larr; All Afsoon games</a>
    <h1>Afsoon Solitaire</h1>
    <div class="stats"><span>Moves <b id="mv">0</b></span><span>Time <b id="tm">0:00</b></span></div>
    <div class="btns"><button id="undo" type="button">Undo</button><button id="ng" type="button">New game</button></div>
  </header>
  <div class="table">
    <div class="row top" id="top"></div>
    <div class="row" id="tab"></div>
  </div>
  <div class="win" id="win" aria-live="polite"></div>
  <p class="help">Drag a card to move it, or tap a card to send it to the best spot. Tap the deck to draw a new card.</p>
</div>

<script>
(function(){
const RAW=JSON.parse(document.getElementById('cards').textContent);
const URLS={};for(const k in RAW){URLS[k]=URL.createObjectURL(new Blob([RAW[k]],{type:'image/svg+xml'}))}
const SUITS=['S','H','D','C'],SYM=['♠','♥','♦','♣'],RK=['','a','2','3','4','5','6','7','8','9','10','j','q','k'];
const img=c=>URLS[c.up?SUITS[c.s]+RK[c.r]:'B2'];
const red=c=>c.s==1||c.s==2;
let st,wa,fd,tb,sel,mv,t0,hist,won;
const $=id=>document.getElementById(id);
function snap(){return JSON.stringify({st,wa,fd,tb,mv})}
function save(){hist.push(snap());if(hist.length>200)hist.shift()}
function deal(){
  let d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({r,s,up:false});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  tb=[];for(let i=0;i<7;i++){tb.push(d.splice(0,i+1));tb[i][i].up=true}
  st=d;wa=[];fd=[[],[],[],[]];sel=null;mv=0;t0=null;hist=[];won=false;render();
}
function cardEl(c,attrs,top,isSel){
  return '<div class="card'+(isSel?' sel':'')+'" '+attrs+' style="top:'+top+'px"><img alt="" src="'+img(c)+'"></div>';
}
function render(){
  const tabRow=$('tab');
  const gap=parseFloat(getComputedStyle(tabRow).columnGap)||8;
  const cw=Math.max(30,(tabRow.clientWidth-6*gap)/7);
  const ch=cw*1.4,offUp=Math.round(ch*.27),offDn=Math.round(ch*.1);
  let h='<div class="slot" data-k="s" aria-label="Deck">'+(st.length?cardEl({up:false},'data-k="s"',0,false):'↻')+'</div>';
  h+='<div class="slot" data-k="w" style="border-color:transparent">'+(wa.length?cardEl(wa[wa.length-1],'data-k="w"',0,sel&&sel.k=='w'):'')+'</div><div></div>';
  fd.forEach((f,i)=>{h+='<div class="slot" data-k="f" data-i="'+i+'">'+(f.length?cardEl(f[f.length-1],'data-k="f" data-i="'+i+'"',0,sel&&sel.k=='f'&&sel.i==i):SYM[i])+'</div>'});
  $('top').innerHTML=h;
  let t='';
  tb.forEach((p,i)=>{
    let top=0,c='';
    p.forEach((cd,x)=>{c+=cardEl(cd,'data-k="t" data-i="'+i+'" data-x="'+x+'"',top,sel&&sel.k=='t'&&sel.i==i&&x>=sel.x);if(x<p.length-1)top+=cd.up?offUp:offDn});
    t+='<div class="col" data-k="t" data-i="'+i+'" data-x="-1" style="height:'+Math.ceil(top+ch)+'px">'+(p.length?c:'<div class="slot" data-k="t" data-i="'+i+'" data-x="-1"></div>')+'</div>';
  });
  tabRow.innerHTML=t;
  $('mv').textContent=mv;
  if(!won&&fd.every(f=>f.length==13)){won=true;$('win').textContent='You win in '+mv+' moves!'}
  if(!won)$('win').textContent='';
}
function src(){if(sel.k=='w')return[wa[wa.length-1]];if(sel.k=='f')return[fd[sel.i][fd[sel.i].length-1]];return tb[sel.i].slice(sel.x)}
const okF=(c,f)=>f.length?f[f.length-1].s==c.s&&f[f.length-1].r+1==c.r:c.r==1;
const okT=(c,p)=>{if(!p.length)return c.r==13;const t=p[p.length-1];return t.up&&red(t)!=red(c)&&t.r==c.r+1};
function tryMove(k,i){
  const cs=src();let ok=false;
  if(k=='f'&&cs.length==1&&!(sel.k=='f'&&sel.i==i))ok=okF(cs[0],fd[i]);
  if(k=='t'&&!(sel.k=='t'&&sel.i==i))ok=okT(cs[0],tb[i]);
  if(!ok)return false;
  save();
  if(sel.k=='w')wa.pop();else if(sel.k=='f')fd[sel.i].pop();else{tb[sel.i].splice(sel.x);const p=tb[sel.i];if(p.length)p[p.length-1].up=true}
  (k=='f'?fd[i]:tb[i]).push(...cs);mv++;sel=null;start();return true;
}
function pick(k,i,x){sel=null;if(k=='w'&&wa.length)sel={k:'w'};else if(k=='f'&&fd[i].length)sel={k:'f',i};else if(k=='t'&&x>=0&&tb[i][x]&&tb[i][x].up)sel={k:'t',i,x}}
function start(){if(!t0)t0=Date.now()}
function targetOf(el){const t=el&&el.closest?el.closest('[data-k]'):null;if(!t)return null;return{k:t.dataset.k,i:+t.dataset.i,x:t.dataset.x===undefined?-1:+t.dataset.x}}
function drawStock(){save();if(st.length){const c=st.pop();c.up=true;wa.push(c)}else{st=wa.reverse();st.forEach(c=>c.up=false);wa=[]}sel=null;mv++;start();render()}
function isSource(t){return t&&((t.k=='w'&&wa.length)||(t.k=='f'&&fd[t.i].length)||(t.k=='t'&&t.x>=0&&tb[t.i][t.x]&&tb[t.i][t.x].up))}
function autoMove(t){
  pick(t.k,t.i,t.x);if(!sel)return false;
  const single=sel.k!='t'||sel.x==tb[sel.i].length-1;
  if(single&&sel.k!='f')for(let f=0;f<4;f++)if(tryMove('f',f))return true;
  const ord=[...Array(7).keys()].sort((a,b)=>(tb[a].length?0:1)-(tb[b].length?0:1));
  for(const j of ord){if(!tb[j].length&&sel.k=='t'&&sel.x==0)continue;if(tryMove('t',j))return true}
  return false;
}
function tap(t){
  if(!t||won)return;
  if(t.k=='s'){drawStock();return}
  if(sel){const same=(sel.k==t.k&&sel.i===t.i&&(t.k!='t'||sel.x==t.x))||(sel.k=='w'&&t.k=='w');
    if(same){sel=null;render();return}
    if((t.k=='t'||t.k=='f')&&tryMove(t.k,t.i)){render();return}}
  if(isSource(t)){if(autoMove(t)){render();return}pick(t.k,t.i,t.x);render();return}
  sel=null;render();
}
const table=document.querySelector('.table');
let press=null,drag=null;
table.addEventListener('pointerdown',e=>{
  if(won||(e.pointerType=='mouse'&&e.button!==0))return;
  const t=targetOf(e.target);if(!t)return;
  press={t,x0:e.clientX,y0:e.clientY,id:e.pointerId};
});
addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.id)return;
  if(!drag){
    if(Math.hypot(e.clientX-press.x0,e.clientY-press.y0)<6)return;
    if(!isSource(press.t)){press=null;return}
    pick(press.t.k,press.t.i,press.t.x);
    const els=press.t.k=='t'?[...table.querySelectorAll('#tab .card[data-i="'+press.t.i+'"]')].filter(el=>+el.dataset.x>=press.t.x):[table.querySelector(press.t.k=='w'?'.card[data-k="w"]':'.card[data-k="f"][data-i="'+press.t.i+'"]')];
    const r0=els[0].getBoundingClientRect();
    const g=document.createElement('div');g.className='ghost';g.style.width=r0.width+'px';
    els.forEach(el=>{const r=el.getBoundingClientRect();const c=el.cloneNode(true);c.classList.remove('sel');c.style.top=(r.top-r0.top)+'px';g.appendChild(c);el.style.visibility='hidden'});
    document.body.appendChild(g);
    drag={g,dx:press.x0-r0.left,dy:press.y0-r0.top,els};
  }
  e.preventDefault();
  drag.g.style.transform='translate('+(e.clientX-drag.dx)+'px,'+(e.clientY-drag.dy)+'px)';
},{passive:false});
function endPress(e){
  if(!press||e.pointerId!==press.id)return;
  const p=press;press=null;
  if(!drag){if(e.type=='pointerup')tap(p.t);return}
  const d=drag;drag=null;d.g.remove();
  let moved=false;
  if(e.type=='pointerup'){
    const t=targetOf(document.elementFromPoint(e.clientX,e.clientY));
    if(t&&(t.k=='t'||t.k=='f')&&sel)moved=tryMove(t.k,t.i);
  }
  sel=null;d.els.forEach(el=>el.style.visibility='');render();
}
addEventListener('pointerup',endPress);addEventListener('pointercancel',endPress);
$('ng').onclick=deal;
$('undo').onclick=()=>{if(!hist.length||won)return;const s=JSON.parse(hist.pop());({st,wa,fd,tb,mv}=s);sel=null;render()};
setInterval(()=>{if(!t0||won)return;const s=Math.floor((Date.now()-t0)/1000);$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,80)});
deal();requestAnimationFrame(render);
})();
